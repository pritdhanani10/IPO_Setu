version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iposetu-postgres
    restart: always
    environment:
      POSTGRES_DB: iposetu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iposetu-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=iposetu_db;Username=postgres;Password=postgrespassword
      - Firebase__ProjectId=iposetu
      - Security__PanEncryptionKey=IPOSetuSecretKey2026MasterKeyAES256GCM32Bytes!
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
